<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラッシュパズル</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #game-container {
      position: relative;
    }

    canvas {
      display: block;
      border-radius: 8px;
      cursor: crosshair;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .hud-box {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 8px 16px;
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-box span {
      font-size: 22px;
      font-weight: bold;
      color: #ffd700;
    }

    #ball-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ball-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff8c42, #c0392b);
      box-shadow: 0 0 6px rgba(255,100,0,0.7);
      transition: opacity 0.3s;
    }

    .ball-dot.used {
      background: #444;
      box-shadow: none;
      opacity: 0.4;
    }

    #message-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      border: 2px solid #ffd700;
      border-radius: 16px;
      padding: 30px 50px;
      text-align: center;
      color: #fff;
      display: none;
      pointer-events: all;
      z-index: 10;
    }

    #message-box h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    #message-box p {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
    }

    #restart-btn {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 16px;
      font-weight: bold;
      color: #1a1a2e;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #restart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(255,200,0,0.5);
    }

    #aim-line-canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #instruction {
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <canvas id="aim-line-canvas"></canvas>
    <div id="ui-overlay">
      <div id="hud">
        <div class="hud-box">
          ボール残り&nbsp;
          <div id="ball-icons"></div>
        </div>
        <div class="hud-box">ステージ&nbsp;<span id="stage-display">1</span>&nbsp;/&nbsp;3</div>
        <div class="hud-box">スコア&nbsp;<span id="score-display">0</span></div>
        <div class="hud-box">ブロック残り&nbsp;<span id="block-display">0</span></div>
      </div>
    </div>
    <div id="message-box">
      <h2 id="msg-title">🎉 クリア！</h2>
      <p id="msg-body">すごい！全ブロックを穴に落とした！</p>
      <button id="restart-btn">もう一度</button>
    </div>
  </div>
  <p id="instruction">スリングショットをドラッグして離すとボールが飛ぶ　|　残り5球でブロックをすべて穴に落とせ！</p>

  <!-- Matter.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
